<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ricevimento Merci — Contraste</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --lab:#1a3a5c;--lab-lt:#edf2f7;--lab-bd:#b0c8e4;--lab-bg:#e8f0f8;
  --cuc:#8b3a1e;--cuc-lt:#fdf0eb;--cuc-bd:#e8b89a;--cuc-bg:#fdf4ef;
  --bg:#f0f0ed;--surface:#fff;--border:#e2e0db;
  --text:#111110;--text2:#555350;--text3:#999793;
  --green:#1e5c3a;
  --dc:var(--lab);--dl:var(--lab-lt);--db:var(--lab-bd);--dbg:var(--lab-bg);
  --nav:#0f2135;
}
body.cuc{
  --dc:var(--cuc);--dl:var(--cuc-lt);--db:var(--cuc-bd);--dbg:var(--cuc-bg);
  --nav:#3d1a0a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',sans-serif;background:var(--dbg);min-height:100vh;transition:background .3s}
input,select,button{font-family:'Outfit',sans-serif;-webkit-appearance:none}
input[type=text],input[type=date]{text-transform:uppercase}
input:focus,select:focus{outline:none}

/* ── NAV ── */
.nav{
  background:var(--nav);
  padding:14px 18px 10px;
  position:sticky;top:0;z-index:100;
  transition:background .3s;
}
.nav-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav-logo{font-size:28px;font-weight:800;color:#fff;letter-spacing:.6px;text-transform:uppercase;line-height:1}
.nav-logo-lab{display:block}
.nav-logo-cuc{display:none}
body.cuc .nav-logo-lab{display:none}
body.cuc .nav-logo-cuc{display:block}
.dot{width:9px;height:9px;border-radius:50%;background:#555;flex-shrink:0;transition:background .3s}
.dot.ok{background:#2ecc71}.dot.err{background:#e74c3c}.dot.spin{background:#f39c12;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* DEPT SWITCHER — pill style */
.dept-pills{display:flex;gap:8px}
.dept-pill{flex:1;padding:9px 0;border:none;border-radius:30px;font-size:13px;font-weight:700;cursor:pointer;color:rgba(255,255,255,.4);background:rgba(255,255,255,.07);transition:all .2s;letter-spacing:.3px;text-transform:uppercase}
.dept-pill.on{background:var(--dc);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}

/* ── TABS ── */
.tabs{display:flex;gap:0;margin:14px 16px 0;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab{flex:1;padding:13px 8px;border:none;background:transparent;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);transition:all .2s;border-bottom:2px solid transparent}
.tab.on{color:var(--dc);border-bottom-color:var(--dc);background:var(--dl)}

/* ── CONTENT ── */
.content{padding:14px 16px 60px}

/* ── CARDS ── */
.card{background:var(--surface);border-radius:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.07);overflow:hidden}
.card-head{padding:12px 16px;background:var(--dl);border-bottom:1px solid var(--db);display:flex;align-items:center;justify-content:space-between;transition:background .3s,border .3s}
.card-head-title{font-size:14px;font-weight:700;color:var(--dc);text-transform:uppercase;letter-spacing:.3px;transition:color .3s}
.card-head-sub{font-size:10px;color:var(--text3);text-align:right;line-height:1.5}
.card-body{padding:14px 16px}

/* ── FIELDS ── */
.f{margin-bottom:12px}
.f:last-child{margin-bottom:0}
.f label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:5px}
.f input,.f select{
  width:100%;padding:13px 14px;
  border:1.5px solid var(--border);border-radius:10px;
  font-size:15px;background:var(--bg);color:var(--text);
  transition:border .15s,background .15s;
}
.f input:focus,.f select:focus{border-color:var(--dc);background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── BIG SAVE BTN ── */
.btn-save{
  width:100%;padding:16px;
  background:var(--dc);color:#fff;border:none;border-radius:12px;
  font-size:15px;font-weight:700;cursor:pointer;
  transition:opacity .15s,background .3s;
  letter-spacing:.3px;margin-top:4px;
}
.btn-save:active{opacity:.75}

/* ── SEARCH BAR ── */
.search-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border-radius:12px;
  padding:12px 14px;margin-bottom:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
}
.search-bar svg{flex-shrink:0;opacity:.4}
.search-bar input{flex:1;border:none;background:transparent;font-size:15px;color:var(--text)}
.search-bar input::placeholder{color:var(--text3)}

/* ── ING CARD ── */
.ing-updated{font-size:10px;color:var(--text3);text-align:center;margin-top:10px}

/* ── DDT ITEMS LIST ── */
.ddt-item{
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:12px;padding:12px 14px;margin-bottom:8px;
  display:flex;flex-direction:column;gap:8px;
  transition:border .2s;
}
.ddt-item:focus-within{border-color:var(--dc)}
.ddt-item-top{display:flex;align-items:center;justify-content:space-between}
.ddt-item-name{font-size:14px;font-weight:700;color:var(--text)}
.ddt-item-del{background:none;border:none;color:var(--text3);font-size:26px;cursor:pointer;padding:0;line-height:1;width:32px;text-align:center}
.ddt-item-lotto input{
  width:100%;padding:11px 12px;
  border:1.5px solid var(--border);border-radius:9px;
  font-size:14px;background:#fff;color:var(--text);
  text-transform:uppercase;
  transition:border .15s;
}
.ddt-item-lotto input:focus{border-color:var(--dc);outline:none}
.badge-new{font-size:10px;background:#eaf4ef;color:var(--green);padding:2px 7px;border-radius:20px;font-weight:700;margin-left:6px}

/* ── ADD PRODUCT ROW ── */
.add-section{
  background:var(--surface);border-radius:14px;
  padding:14px 16px;margin-bottom:12px;
  box-shadow:0 1px 6px rgba(0,0,0,.07);
}
.add-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:10px}
.add-ing-wrap{position:relative;margin-bottom:10px}
.add-ing-wrap input{
  width:100%;padding:13px 14px;
  border:1.5px solid var(--border);border-radius:10px;
  font-size:15px;background:var(--bg);color:var(--text);
  text-transform:uppercase;transition:border .15s;
}
.add-ing-wrap input:focus{border-color:var(--dc);background:#fff;outline:none}
.add-lotto-row{display:flex;gap:10px;align-items:stretch}
.add-lotto-row input{
  flex:1;padding:13px 14px;
  border:1.5px solid var(--border);border-radius:10px;
  font-size:15px;background:var(--bg);color:var(--text);
  text-transform:uppercase;transition:border .15s;
}
.add-lotto-row input:focus{border-color:var(--dc);background:#fff;outline:none}
.add-lotto-row .btn-add{
  padding:13px 20px;
  background:var(--dc);color:#fff;border:none;border-radius:10px;
  font-size:15px;font-weight:700;cursor:pointer;
  transition:opacity .15s,background .3s;white-space:nowrap;flex-shrink:0;
}
.add-lotto-row .btn-add:active{opacity:.75}

/* AUTOCOMPLETE */
.ac{
  display:none;position:absolute;
  top:calc(100% + 4px);left:0;right:0;
  background:#fff;border:1.5px solid var(--db);
  border-radius:12px;z-index:50;overflow:hidden;
  box-shadow:0 6px 24px rgba(0,0,0,.12);
}
.ac-i{padding:13px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border)}
.ac-i:last-child{border:none}
.ac-i:active{background:var(--dl)}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.b-exists{background:var(--dl);color:var(--dc)}
.b-new{background:#eaf4ef;color:var(--green)}

/* EMPTY */
.empty{text-align:center;padding:32px 16px;color:var(--text3);font-size:14px;font-style:italic}

/* TOAST */
.toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#111;color:#fff;
  padding:12px 24px;border-radius:30px;
  font-size:14px;font-weight:600;
  opacity:0;transition:all .25s;
  z-index:999;pointer-events:none;
  max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.warn{background:#c0392b}
.toast.ok{background:var(--dc)}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-top">
    <div class="nav-logo">
      <div class="nav-logo-lab">LABORATORIO</div>
      <div class="nav-logo-cuc">CUCINA</div>
    </div>
    <div id="dot" class="dot spin"></div>
  </div>
  <div class="dept-pills">
    <button id="bLab" class="dept-pill on" onclick="switchDept('lab')">Laboratorio</button>
    <button id="bCuc" class="dept-pill" onclick="switchDept('cuc')">Cucina</button>
  </div>
</nav>

<!-- TABS -->
<div class="tabs">
  <button id="tIng" class="tab on" onclick="switchTab('ing')">Ingredienti</button>
  <button id="tDDT" class="tab" onclick="switchTab('ddt')">Inserisci DDT</button>
</div>

<div class="content">

  <!-- ── TAB INGREDIENTI ── -->
  <div id="pIng">
    <div class="search-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" placeholder="Cerca prodotto…" oninput="filterIngs(this.value)">
    </div>
    <div id="ingList"></div>
  </div>

  <!-- ── TAB DDT ── -->
  <div id="pDDT" style="display:none">

    <!-- Dati comuni -->
    <div class="card">
      <div class="card-head"><div class="card-head-title">Dati DDT</div></div>
      <div class="card-body">
        <div class="g2">
          <div class="f"><label>Fornitore</label><input type="text" id="dForn" placeholder="Es. CARENA" autocomplete="off"></div>
          <div class="f"><label>N° DDT</label><input type="text" id="dNum" placeholder="Es. 345" autocomplete="off"></div>
        </div>
        <div class="f"><label>Data DDT</label><input type="date" id="dDate"></div>
      </div>
    </div>

    <!-- Prodotti aggiunti -->
    <div id="ddtList"></div>

    <!-- Aggiungi prodotto -->
    <div class="add-section">
      <div class="add-section-title">Aggiungi prodotto al DDT</div>
      <div class="add-ing-wrap">
        <input type="text" id="dIng" placeholder="Nome prodotto…"
          oninput="onDDTInput(this.value)"
          onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('dLotto').focus()}"
          autocomplete="off">
        <div id="dAc" class="ac"></div>
      </div>
      <div class="add-lotto-row">
        <input type="text" id="dLotto" placeholder="Lotto / Scadenza prodotto"
          onkeydown="if(event.key==='Enter'){event.preventDefault();addDItem()}">
        <button class="btn-add" onclick="addDItem()">+ Aggiungi</button>
      </div>
    </div>

    <button class="btn-save" onclick="saveDDT()">Salva DDT</button>
  </div>

</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const cfg = {
  apiKey:"AIzaSyD7vZlwcg1EgZhBucjz7WoiSMTIs6ouXRQ",
  authDomain:"ricettecontraste.firebaseapp.com",
  projectId:"ricettecontraste",
  storageBucket:"ricettecontraste.firebasestorage.app",
  messagingSenderId:"861699797515",
  appId:"1:861699797515:web:8fc4e58e527609cc5d8d0e"
};
const DB_DOC = doc(getFirestore(initializeApp(cfg)), 'ristorante', 'database');

let db={ingredients:[],animalData:{lab:{},cucina:{}},recipes:{lab:[],cucina:[]}};
let dept='lab', tab='ing', ddtItems=[], _t=null, _last=null;
let _dbLoaded=false;
const CACHE_KEY='etichette_db_cache_v1';
function recipeCount(x){ try{ return (x.recipes.lab.length||0)+(x.recipes.cucina.length||0); }catch(_){ return 0; } }
function cacheSave(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(db)); }catch(_){} }
function cacheLoad(){ try{ const s=localStorage.getItem(CACHE_KEY); return s?JSON.parse(s):null; }catch(_){ return null; } }

const $=id=>document.getElementById(id);
const setDot=s=>{ $('dot').className='dot '+s; };

async function saveDB(){
  if(!_dbLoaded){ setDot('err'); if(window.toast) toast('Dati non caricati: salvataggio bloccato','err'); return; }
  if(_t) clearTimeout(_t);
  setDot('spin');
  _t=setTimeout(async()=>{
    const s=JSON.stringify(db);
    if(s===_last){setDot('ok');return;}
    try{ await setDoc(DB_DOC,{data:s}); _last=s; cacheSave(); setDot('ok'); }
    catch(e){ setDot('err'); }
  },600);
}

async function init(){
  setDot('spin');
  try{
    const s=await getDoc(DB_DOC);
    if(s&&s.exists()){ db=JSON.parse(s.data().data); fixDB(); }
    _dbLoaded=true; cacheSave(); setDot('ok');
  }catch(e){
    const c=cacheLoad();
    if(c && recipeCount(c)>0){ db=c; fixDB(); }  // mostro l'ultima copia locale, resto in sola lettura
    setDot('err');
  }
  onSnapshot(DB_DOC,s=>{
    if(!s||!s.exists()) return;
    try{
      const r=JSON.parse(s.data().data);
      if(JSON.stringify(r)===_last) return;
      // ANTI-CANCELLAZIONE: non applico un DB remoto svuotato se in locale ho ricette
      if(_dbLoaded && recipeCount(r)===0 && recipeCount(db)>0){ setDot('err'); return; }
      db=r; fixDB(); _dbLoaded=true; cacheSave();
      if(tab==='ing') renderIngList();
    }catch(e){}
  });
  renderIngList();
}

function fixDB(){
  if(!db.animalData) db.animalData={};
  if(!db.animalData.lab) db.animalData.lab={};
  if(!db.animalData.cucina) db.animalData.cucina={};
  if(!db.ingredients) db.ingredients=[];
}

let _tT;
window.toast=function(m,type=''){
  const t=$('toast');
  t.textContent=m; t.className='toast show'+(type?' '+type:'');
  clearTimeout(_tT); _tT=setTimeout(()=>{ t.className='toast'; },2600);
};

const dbDept=()=>dept==='lab'?'lab':'cucina';

window.switchDept=function(d){
  dept=d;
  document.body.className=d==='cuc'?'cuc':'';
  $('bLab').className='dept-pill'+(d==='lab'?' on':'');
  $('bCuc').className='dept-pill'+(d==='cuc'?' on':'');
  renderIngList();
  ddtItems=[]; renderDDT();
};

window.switchTab=function(t){
  tab=t;
  $('pIng').style.display=t==='ing'?'':'none';
  $('pDDT').style.display=t==='ddt'?'':'none';
  $('tIng').className='tab'+(t==='ing'?' on':'');
  $('tDDT').className='tab'+(t==='ddt'?' on':'');
  if(t==='ddt'){ ddtItems=[]; renderDDT(); }
};

window.filterIngs=function(q){ renderIngList(q); };

function renderIngList(q=''){
  const el=$('ingList');
  q=q.toLowerCase().trim();
  let ings=db.ingredients.filter(i=>i.isAnimal);
  if(q) ings=ings.filter(i=>i.name.toLowerCase().includes(q));
  if(!ings.length){
    el.innerHTML=`<div class="empty">${q?`Nessun risultato per "${q}"` :'Nessun prodotto animale nel database'}</div>`;
    return;
  }
  el.innerHTML=ings.map(i=>{
    const d=db.animalData[dbDept()]?.[i.name]||{};
    const n=i.name.replace(/'/g,"\\'");
    const ts=d._updated?`<div class="ing-updated">Aggiornato: ${d._updated}</div>`:'';
    return `<div class="card">
      <div class="card-head">
        <div class="card-head-title">${i.name}</div>
        ${d._updated?`<div class="card-head-sub">${d._updated}</div>`:''}
      </div>
      <div class="card-body">
        <div class="g2">
          <div class="f"><label>Fornitore</label>
            <input type="text" id="f-${i.name}" value="${d.fornitore||''}" placeholder="Es. CARENA"></div>
          <div class="f"><label>N° DDT</label>
            <input type="text" id="d-${i.name}" value="${d.ddt||''}" placeholder="Es. 345"></div>
          <div class="f"><label>Data DDT</label>
            <input type="date" id="dt-${i.name}" value="${d.dataDDT||''}"></div>
          <div class="f"><label>Lotto / Scad.</label>
            <input type="text" id="l-${i.name}" value="${d.lotto||''}" placeholder="Es. L240315"></div>
        </div>
        <button class="btn-save" onclick="saveIng('${n}')">Salva</button>
      </div>
    </div>`;
  }).join('');
}

window.saveIng=function(name){
  const dd=dbDept();
  if(!db.animalData[dd]) db.animalData[dd]={};
  if(!db.animalData[dd][name]) db.animalData[dd][name]={};
  const d=db.animalData[dd][name];
  d.fornitore=($(`f-${name}`)?.value||'').toUpperCase();
  d.ddt=($(`d-${name}`)?.value||'').toUpperCase();
  d.dataDDT=$(`dt-${name}`)?.value||'';
  d.lotto=($(`l-${name}`)?.value||'').toUpperCase();
  d._updated=new Date().toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  saveDB(); toast(`"${name}" salvato!`,'ok');
};

window.onDDTInput=function(val){
  const ac=$('dAc');
  const v=val.trim().toUpperCase();
  if(!v){ac.style.display='none';return;}
  const added=ddtItems.map(i=>i.name);
  const matches=db.ingredients.filter(i=>i.isAnimal&&i.name.includes(v)&&!added.includes(i.name));
  const exact=db.ingredients.some(i=>i.name===v);
  let h=matches.map(i=>`<div class="ac-i" onmousedown="selectD('${i.name.replace(/'/g,"\\'")}')">
    <span>${i.name}</span><span class="badge b-exists">nel DB</span>
  </div>`).join('');
  if(!exact) h+=`<div class="ac-i" onmousedown="selectD('${v.replace(/'/g,"\\'")}',true)">
    <span>+ Aggiungi "<strong>${v}</strong>"</span><span class="badge b-new">nuovo</span>
  </div>`;
  if(!h){ac.style.display='none';return;}
  ac.innerHTML=h; ac.style.display='block';
};

window.selectD=function(name){
  $('dIng').value=name;
  $('dAc').style.display='none';
  $('dLotto').focus();
};

window.addDItem=function(){
  const ni=$('dIng'), nl=$('dLotto');
  const name=(ni.value||'').trim().toUpperCase();
  const lotto=(nl.value||'').toUpperCase();
  if(!name){toast('Inserisci il nome del prodotto','warn');return;}
  if(ddtItems.find(i=>i.name===name)){toast('Prodotto già aggiunto','warn');return;}
  const isNew=!db.ingredients.find(i=>i.name===name);
  ddtItems.push({name,lotto,isNew});
  ni.value=''; nl.value='';
  $('dAc').style.display='none';
  renderDDT(); ni.focus();
};

window.removeDItem=function(name){
  ddtItems=ddtItems.filter(i=>i.name!==name);
  renderDDT();
};

window.updateLotto=function(idx,val){
  if(ddtItems[idx]) ddtItems[idx].lotto=val.toUpperCase();
};

function renderDDT(){
  const el=$('ddtList');
  if(!ddtItems.length){ el.innerHTML=''; return; }
  el.innerHTML=ddtItems.map((item,idx)=>`
    <div class="ddt-item">
      <div class="ddt-item-top">
        <div class="ddt-item-name">
          ${item.name}
          ${item.isNew?'<span class="badge-new">NUOVO</span>':''}
        </div>
        <button class="ddt-item-del" onclick="removeDItem('${item.name.replace(/'/g,"\\'")}')">×</button>
      </div>
      <div class="ddt-item-lotto">
        <input type="text" value="${item.lotto}" placeholder="Lotto / Scadenza prodotto"
          oninput="updateLotto(${idx},this.value)">
      </div>
    </div>`).join('');
}

window.saveDDT=async function(){
  const forn=($('dForn').value||'').toUpperCase();
  const num=($('dNum').value||'').toUpperCase();
  const date=$('dDate').value||'';
  if(!num&&!forn){toast('Inserisci fornitore o N° DDT','warn');return;}
  if(!ddtItems.length){toast('Aggiungi almeno un prodotto','warn');return;}
  const dd=dbDept();
  if(!db.animalData[dd]) db.animalData[dd]={};
  for(const item of ddtItems){
    if(item.isNew&&!db.ingredients.find(i=>i.name===item.name))
      db.ingredients.push({name:item.name,isAnimal:true,isAllergen:false});
    if(!db.animalData[dd][item.name]) db.animalData[dd][item.name]={};
    const e=db.animalData[dd][item.name];
    if(forn) e.fornitore=forn;
    if(num)  e.ddt=num;
    if(date) e.dataDDT=date;
    if(item.lotto) e.lotto=item.lotto;
    e._updated=new Date().toLocaleString('it-IT');
  }
  await saveDB();
  toast(`DDT salvato per ${ddtItems.length} prodott${ddtItems.length===1?'o':'i'}!`,'ok');
  ['dForn','dNum','dDate'].forEach(id=>{ $(id).value=''; });
  ddtItems=[]; renderDDT();
};

document.addEventListener('touchstart',e=>{
  if(!e.target.closest('#dIng')&&!e.target.closest('#dAc'))
    $('dAc').style.display='none';
},{passive:true});

init();
</script>
</body>
</html>
